[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"
[project]
name = "l9-ci-debt-resolver"
version = "0.7.0"
description = "Evidence-first CI failure diagnosis and bounded recovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Quantum-L9" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "pyyaml>=6.0,<7"
]
[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=7.1.0,<8",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1"
]
[project.scripts]
l9-debt-resolver = "l9_debt_resolver.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/l9_debt_resolver"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
# Ruff configuration lives in ruff.toml (single source of truth); it uses the
# same target-version and line-length declared here so the two stay coherent.
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["l9_debt_resolver"]
